# ============================================================
# Bench2Drive base configuration for BEVFusion
#
# Key differences from NuScenes default.yaml:
#   - dataset_type: Bench2DriveDataset
#   - 9 object classes (Carla/B2D classes)
#   - No map segmentation (no LoadBEVSegmentation)
#   - No ObjectPaste / GT-DB augmentation (no B2D GT database)
#   - No LoadPointsFromMultiSweeps (B2D has no temporal sweeps)
#   - Ann files: b2d_infos_train.pkl / b2d_infos_val.pkl
# ============================================================

dataset_type: Bench2DriveDataset
dataset_root: data/bench2drive/
info_root: data/infos/
max_epochs: 20
gt_paste_stop_epoch: -1
reduce_beams: 32
load_dim: 4        # B2D LiDAR .npy: [x, y, z, intensity]
use_dim: 4
load_augmented: null

point_cloud_range: [-51.2, -51.2, -5.0, 51.2, 51.2, 3.0]
voxel_size: [0.1, 0.1, 0.2]
image_size: [256, 704]

augment2d:
  resize: [[0.38, 0.55], [0.48, 0.48]]
  rotate: [-5.4, 5.4]
  gridmask:
    prob: 0.0
    fixed_prob: true

augment3d:
  scale: [0.9, 1.1]
  rotate: [-0.78539816, 0.78539816]
  translate: 0.5

# Bench2Drive object classes (Carla-based)
object_classes:
  - car
  - van
  - truck
  - bicycle
  - traffic_sign
  - traffic_cone
  - traffic_light
  - pedestrian
  - others

# Eval configuration for Bench2Drive
eval_cfg:
  dist_ths: [0.5, 1.0, 2.0, 4.0]
  dist_th_tp: 2.0
  min_recall: 0.1
  min_precision: 0.1
  mean_ap_weight: 5
  class_names:
    - car
    - van
    - truck
    - bicycle
    - traffic_sign
    - traffic_cone
    - traffic_light
    - pedestrian
  tp_metrics:
    - trans_err
    - scale_err
    - orient_err
    - vel_err
  err_name_maping:
    trans_err: mATE
    scale_err: mASE
    orient_err: mAOE
    vel_err: mAVE
    attr_err: mAAE
  class_range:
    car: [50, 50]
    van: [50, 50]
    truck: [50, 50]
    bicycle: [40, 40]
    traffic_sign: [30, 30]
    traffic_cone: [30, 30]
    traffic_light: [30, 30]
    pedestrian: [40, 40]

input_modality:
  use_lidar: true
  use_camera: true
  use_radar: false
  use_map: false
  use_external: false

# ------------------------------------------------------------------ #
# Training pipeline (camera + LiDAR, no sweeps, no map segmentation)
# ------------------------------------------------------------------ #
train_pipeline:
  -
    type: LoadMultiViewImageFromFiles
    to_float32: true
  -
    type: LoadPointsFromFile
    coord_type: LIDAR
    load_dim: ${load_dim}
    use_dim: ${use_dim}
    reduce_beams: ${reduce_beams}
    load_augmented: ${load_augmented}
  -
    # B2D has no temporal sweeps; pad with the keyframe itself
    type: LoadPointsFromMultiSweeps
    sweeps_num: 0
    load_dim: ${load_dim}
    use_dim: ${use_dim}
    reduce_beams: ${reduce_beams}
    pad_empty_sweeps: true
    remove_close: true
    load_augmented: ${load_augmented}
  -
    # B2D raw .npy points are in CARLA LiDAR frame, but lidar2ego / GT boxes
    # expect Frame_L (X,Y swapped). This aligns loaded points.
    type: SwapLiDARXY
  -
    type: LoadAnnotations3D
    with_bbox_3d: true
    with_label_3d: true
    with_attr_label: False
  -
    type: ImageAug3D
    final_dim: ${image_size}
    resize_lim: ${augment2d.resize[0]}
    bot_pct_lim: [0.0, 0.0]
    rot_lim: ${augment2d.rotate}
    rand_flip: true
    is_train: true
  -
    type: GlobalRotScaleTrans
    resize_lim: ${augment3d.scale}
    rot_lim: ${augment3d.rotate}
    trans_lim: ${augment3d.translate}
    is_train: true
  -
    type: RandomFlip3D
  -
    type: PointsRangeFilter
    point_cloud_range: ${point_cloud_range}
  -
    type: ObjectRangeFilter
    point_cloud_range: ${point_cloud_range}
  -
    type: ObjectNameFilter
    classes: ${object_classes}
  -
    type: ImageNormalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  -
    type: GridMask
    use_h: true
    use_w: true
    max_epoch: ${max_epochs}
    rotate: 1
    offset: false
    ratio: 0.5
    mode: 1
    prob: ${augment2d.gridmask.prob}
    fixed_prob: ${augment2d.gridmask.fixed_prob}
  -
    type: PointShuffle
  -
    type: DefaultFormatBundle3D
    classes: ${object_classes}
  -
    type: Collect3D
    keys:
      - img
      - points
      - gt_bboxes_3d
      - gt_labels_3d
    meta_keys:
      - camera_intrinsics
      - camera2ego
      - lidar2ego
      - lidar2camera
      - camera2lidar
      - lidar2image
      - img_aug_matrix
      - lidar_aug_matrix
  -
    type: GTDepth
    keyframe_only: true

# ------------------------------------------------------------------ #
# Test / validation pipeline
# ------------------------------------------------------------------ #
test_pipeline:
  -
    type: LoadMultiViewImageFromFiles
    to_float32: true
  -
    type: LoadPointsFromFile
    coord_type: LIDAR
    load_dim: ${load_dim}
    use_dim: ${use_dim}
    reduce_beams: ${reduce_beams}
    load_augmented: ${load_augmented}
  -
    type: LoadPointsFromMultiSweeps
    sweeps_num: 0
    load_dim: ${load_dim}
    use_dim: ${use_dim}
    reduce_beams: ${reduce_beams}
    pad_empty_sweeps: true
    remove_close: true
    load_augmented: ${load_augmented}
  -
    type: SwapLiDARXY
  -
    type: LoadAnnotations3D
    with_bbox_3d: true
    with_label_3d: true
    with_attr_label: False
  -
    type: ImageAug3D
    final_dim: ${image_size}
    resize_lim: ${augment2d.resize[1]}
    bot_pct_lim: [0.0, 0.0]
    rot_lim: [0.0, 0.0]
    rand_flip: false
    is_train: false
  -
    type: GlobalRotScaleTrans
    resize_lim: [1.0, 1.0]
    rot_lim: [0.0, 0.0]
    trans_lim: 0.0
    is_train: false
  -
    type: PointsRangeFilter
    point_cloud_range: ${point_cloud_range}
  -
    type: ImageNormalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  -
    type: DefaultFormatBundle3D
    classes: ${object_classes}
  -
    type: Collect3D
    keys:
      - img
      - points
      - gt_bboxes_3d
      - gt_labels_3d
    meta_keys:
      - camera_intrinsics
      - camera2ego
      - lidar2ego
      - lidar2camera
      - camera2lidar
      - lidar2image
      - img_aug_matrix
      - lidar_aug_matrix
  -
    type: GTDepth
    keyframe_only: true

fp16:
  loss_scale: dynamic

data:
  samples_per_gpu: 4
  workers_per_gpu: 4
  train:
    type: ${dataset_type}
    dataset_root: ${dataset_root}
    ann_file: ${info_root + "b2d_infos_train.pkl"}
    pipeline: ${train_pipeline}
    object_classes: ${object_classes}
    modality: ${input_modality}
    eval_cfg: ${eval_cfg}
    test_mode: false
    use_valid_flag: false
    with_velocity: true
    box_type_3d: LiDAR
  val:
    type: ${dataset_type}
    dataset_root: ${dataset_root}
    ann_file: ${info_root + "b2d_infos_val.pkl"}
    pipeline: ${test_pipeline}
    object_classes: ${object_classes}
    modality: ${input_modality}
    eval_cfg: ${eval_cfg}
    test_mode: false
    with_velocity: true
    box_type_3d: LiDAR
  test:
    type: ${dataset_type}
    dataset_root: ${dataset_root}
    ann_file: ${info_root + "b2d_infos_val.pkl"}
    pipeline: ${test_pipeline}
    object_classes: ${object_classes}
    modality: ${input_modality}
    eval_cfg: ${eval_cfg}
    test_mode: true
    with_velocity: true
    box_type_3d: LiDAR

evaluation:
  interval: 1
  pipeline: ${test_pipeline}
