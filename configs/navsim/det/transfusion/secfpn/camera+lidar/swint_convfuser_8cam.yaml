# ============================================================
# BEVFusion | NAVSIM | Camera+LiDAR | SwinT + ConvFuser | all 8 cameras
# ============================================================
# Same as swint_convfuser.yaml but reads all eight camera directions. Features
# are still pooled only into the configured front-only BEV ROI. Roughly 2.7x
# the camera-branch cost of the front-three variant.
# ============================================================

camera_names:
  - CAM_F0
  - CAM_L0
  - CAM_R0
  - CAM_L1
  - CAM_R1
  - CAM_L2
  - CAM_R2
  - CAM_B0

data:
  samples_per_gpu: 2
  workers_per_gpu: 4
