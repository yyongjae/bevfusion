# ============================================================
# NAVSIM (OpenScene / nuPlan) base configuration for BEVFusion
#
# Key differences from the nuScenes default:
#   - dataset_type: NavsimDataset
#   - 7 nuPlan object classes
#   - Ego frame origin is the rear axle, ~0.32 m above the ground, so the
#     vertical range is [-3, 5] instead of nuScenes' [-5, 3].
#   - Front-only BEV: x_forward in [0, 32] m, y_left in [-32, 32] m. A
#     three-front-camera teacher has no rear observation, and encoding the rear
#     anyway cost ~half the LiDAR compute for supervision the student cannot
#     use. `bev_roi` is therefore gone -- the grid *is* the queried region.
#   - The grid is 100 x 100, matching PARA-SSR's `pc_range` / `bev_h` / `bev_w`
#     one-to-one, so BEV distillation is a straight copy. Cells are 0.32 m
#     longitudinal x 0.64 m lateral, non-square, exactly as the student's are
#     (see navsim/agents/para_ssr/configs/default.py). A square-cell 50 x 100
#     variant is the planned ablation on both sides; it needs voxel_size
#     [0.08, 0.08, 0.2] and sparse_shape/grid_size [400, 800, 41] here.
#   - No temporal sweeps (each frame ships one merged point cloud)
#   - No map segmentation head, no GT-database paste
#   - Images are the native 1920x1080 blobs; the resize limits below are
#     expressed relative to the *stored* size.
# ============================================================

dataset_type: NavsimDataset
dataset_root: data/navsim/
info_root: data/infos/
max_epochs: 20
gt_paste_stop_epoch: -1
reduce_beams: 32
load_dim: 5        # converted .bin: [x, y, z, intensity, ring]
use_dim: 5
load_augmented: null
sweeps_num: 2

point_cloud_range: [0.0, -32.0, -3.0, 32.0, 32.0, 5.0]

# No query-initialisation mask: the grid covers only the forward region now, so
# every cell is a legitimate proposal site. `null` restores the head's default
# (whole grid). Kept as a knob because the head still supports it.
bev_roi: null

# Camera field-of-view filtering, OFF by default to match the reference
# implementations this teacher is compared against.
#
# SafeDrive keeps a GT box on the box-centre rectangle alone
# (`boxes_in_bev_roi`: 0 <= x <= 32, -32 <= y <= 32, no visibility test), which
# is exactly what `point_cloud_range` + `ObjectRangeFilter` already do here --
# `in_range_bev` tests the same centre. Its projection test (`point_sampling`)
# masks BEV *features*, not labels, and BEVFusion's LSS already restricts camera
# features to what the cameras see.
#
# Turning this on filters labels by projecting the eight box corners through
# `lidar2image` (see mmdet3d/datasets/fov_utils.py), which removes 5.2% of the
# in-ROI boxes -- concentrated in the near field, 18% within 10 m, where the
# forward-facing cameras cannot look down far enough. PARA-SSR applies a related
# but different rule (`det_fov_half_angle_deg: 80`, a centre-based wedge), so
# enabling this does not reproduce the student's label set either: the two
# predicates agree on 93.1% of in-ROI boxes and disagree on 2.9%.
camera_fov:
  enabled: false
  min_visible_corners: 1   # 1 keeps boxes clipped by the image border
  margin: 0.0              # pixels of slack outside the border
  # `null` = filter everywhere. With the front-only range there is no rear left
  # to protect, so this is now the whole label set; PointsRangeFilter /
  # ObjectRangeFilter drop the rear before it matters either way. Give it an
  # [x_min, y_min, x_max, y_max] box to restrict the filter to part of the grid.
  apply_within: null
  # Stored image size. Needed by the LiDAR-only stage, whose pipeline loads no
  # image; do not leave it to the principal point, which NAVSIM does not centre
  # vertically (cy = 560 on 1080 rows). Update this with any image re-export so
  # stage 1 and the image-loading stages keep identical targets.
  image_wh: [1920, 1080]
# Isotropic: 0.08 m voxels with sparse_shape [400, 800, 41] and out_size_factor
# 8 give a 50 x 100 head grid over the 32 m forward / 64 m lateral ROI, i.e.
# square 0.64 m cells. The earlier 100 x 100 variant used [0.04, 0.08, 0.2] to
# match PARA-SSR's own 100 x 100, whose cells are 0.32 m longitudinal x 0.64 m
# lateral; that grid is the one the student still runs, so distillation across
# this change needs the longitudinal axis resampled 50 -> 100 (or the student
# moved to 50 x 100 as its config comment anticipates).
voxel_size: [0.08, 0.08, 0.2]
image_size: [256, 704]

# Cameras fed to the model. NAVSIM's standard front view is the three front
# cameras; set to null (or list all eight) for full 360 degree coverage.
camera_names:
  - CAM_F0
  - CAM_L0
  - CAM_R0

# Relative to the stored 1920x1080 images: 0.36667 maps 1920 -> 704 (the model
# width) with no upsampling, and the training range keeps the same ratio to the
# eval scale that the 800px re-export used ([0.76, 1.0] against 0.88). Both
# express the identical output sizes -- 608 px at the low end, 800 px at the
# high end -- so only the source detail differs.
# Update these if you re-export at another size: eval becomes 704 / new_width.
augment2d:
  resize: [[0.31667, 0.41667], [0.36667, 0.36667]]
  rotate: [-5.4, 5.4]
  gridmask:
    prob: 0.0
    fixed_prob: true

# The files contain 360-degree clouds, but the queried BEV and camera-conditioned
# labels cover only the forward half. The augmentation must therefore keep the
# camera footprint substantially inside that fixed half-plane. In particular,
# x -> -x mirroring is disabled in the pipelines below.
augment3d:
  scale: [0.9, 1.1]
  # +-10 degrees, not the +-45 upstream uses with 360-degree cameras. The ROI
  # spans 180 degrees of azimuth and the three front cameras cover 174. As a
  # far-field angular estimate, yaw theta leaves (|theta| + 3) / 180 of the ROI
  # unobserved: 27% at 45 degrees and 7% here. Camera translation and the finite
  # rectangular ROI make this an approximation, not a geometric optimum. The
  # unobserved part has no camera features at all -- a distribution the model
  # never meets at test time, where no rotation is applied -- and its labels are
  # deleted by ObjectFOVFilter. Paired-seed 150-frame checks retained
  # 88-91% of targets at 45 degrees against 94-96% here. Raise it only if the
  # camera set is widened.
  rotate: [-0.17453293, 0.17453293]
  translate: 0.5

# nuPlan TrackedObjectType names, as they appear in anns['gt_names'].
object_classes:
  - vehicle
  - pedestrian
  - bicycle
  - traffic_cone
  - barrier
  - czone_sign
  - generic_object

eval_cfg:
  # Identical to point_cloud_range above: rear GT must not count as missed for a
  # model that was never asked to look there. The per-class distance limits
  # below apply in addition.
  point_cloud_range: [0.0, -32.0, -3.0, 32.0, 32.0, 5.0]
  # Same projection test the training targets use, so the model is not scored
  # on objects its cameras never saw. Keep image_wh explicit: NAVSIM's vertical
  # principal point is not centred in the stored image.
  camera_fov:
    enabled: ${camera_fov.enabled}
    min_visible_corners: ${camera_fov.min_visible_corners}
    margin: ${camera_fov.margin}
    apply_within: ${camera_fov.apply_within}
    image_wh: ${camera_fov.image_wh}
  dist_ths: [0.5, 1.0, 2.0, 4.0]
  dist_th_tp: 2.0
  min_recall: 0.1
  min_precision: 0.1
  mean_ap_weight: 5
  class_names:
    - vehicle
    - pedestrian
    - bicycle
    - traffic_cone
    - barrier
    - czone_sign
    - generic_object
  tp_metrics:
    - trans_err
    - scale_err
    - orient_err
    - vel_err
  err_name_maping:
    trans_err: mATE
    scale_err: mASE
    orient_err: mAOE
    vel_err: mAVE
    attr_err: mAAE
  class_range:
    vehicle: [32, 32]
    pedestrian: [32, 32]
    bicycle: [32, 32]
    traffic_cone: [32, 32]
    barrier: [32, 32]
    czone_sign: [32, 32]
    generic_object: [32, 32]

input_modality:
  use_lidar: true
  use_camera: true
  use_radar: false
  use_map: false
  use_external: false

# ------------------------------------------------------------------ #
# Training pipeline (camera + LiDAR, single sweep, no map segmentation)
# ------------------------------------------------------------------ #
train_pipeline:
  -
    type: LoadMultiViewImageFromFiles
    to_float32: true
  -
    type: LoadPointsFromFile
    coord_type: LIDAR
    load_dim: ${load_dim}
    use_dim: ${use_dim}
    reduce_beams: ${reduce_beams}
    load_augmented: ${load_augmented}
  -
    # Previous LiDAR frames, transformed into this frame and stamped with
    # their time offset in channel 4 -- the upstream nuScenes mechanism.
    # NOTE the temporal scale: nuScenes' 10 sweeps span 0.5 s of 20 Hz LiDAR,
    # while NAVSIM has no intermediate LiDAR, so 1 sweep already costs 0.5 s
    # and a median 2.6 m of ego motion. `sweeps_num: 2` keeps roughly the
    # ego displacement nuScenes accumulates; raise it only after checking
    # that moving objects do not smear (see docs/NAVSIM.md).
    type: LoadPointsFromMultiSweeps
    sweeps_num: ${sweeps_num}
    load_dim: ${load_dim}
    use_dim: ${use_dim}
    reduce_beams: ${reduce_beams}
    pad_empty_sweeps: true
    remove_close: true
    load_augmented: ${load_augmented}
  -
    type: LoadAnnotations3D
    with_bbox_3d: true
    with_label_3d: true
    with_attr_label: False
  -
    # Before ImageAug3D/GlobalRotScaleTrans: visibility is a property of the
    # raw sensor geometry, and keeping it there makes the label set the same
    # in every epoch.
    type: ObjectFOVFilter
    min_visible_corners: ${camera_fov.min_visible_corners}
    margin: ${camera_fov.margin}
    enabled: ${camera_fov.enabled}
    apply_within: ${camera_fov.apply_within}
    image_wh: ${camera_fov.image_wh}
  -
    type: ImageAug3D
    final_dim: ${image_size}
    resize_lim: ${augment2d.resize[0]}
    bot_pct_lim: [0.0, 0.0]
    rot_lim: ${augment2d.rotate}
    rand_flip: true
    is_train: true
  -
    type: GlobalRotScaleTrans
    resize_lim: ${augment3d.scale}
    rot_lim: ${augment3d.rotate}
    trans_lim: ${augment3d.translate}
    is_train: true
  -
    type: RandomFlip3D
    # An x -> -x mirror moves the camera footprint behind the fixed front-only
    # BEV and moves rear objects, whose labels ObjectFOVFilter already removed,
    # into it. Lateral mirroring remains valid because both the rig and ROI are
    # left/right symmetric.
    vertical: false
  -
    type: PointsRangeFilter
    point_cloud_range: ${point_cloud_range}
  -
    type: ObjectRangeFilter
    point_cloud_range: ${point_cloud_range}
  -
    type: ObjectNameFilter
    classes: ${object_classes}
  -
    type: ImageNormalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  -
    type: GridMask
    use_h: true
    use_w: true
    max_epoch: ${max_epochs}
    rotate: 1
    offset: false
    ratio: 0.5
    mode: 1
    prob: ${augment2d.gridmask.prob}
    fixed_prob: ${augment2d.gridmask.fixed_prob}
  -
    type: PointShuffle
  -
    type: DefaultFormatBundle3D
    classes: ${object_classes}
  -
    type: Collect3D
    keys:
      - img
      - points
      - gt_bboxes_3d
      - gt_labels_3d
    meta_keys:
      - camera_intrinsics
      - camera2ego
      - lidar2ego
      - lidar2camera
      - camera2lidar
      - lidar2image
      - img_aug_matrix
      - lidar_aug_matrix
  -
    type: GTDepth
    keyframe_only: true

# ------------------------------------------------------------------ #
# Test / validation pipeline
# ------------------------------------------------------------------ #
test_pipeline:
  -
    type: LoadMultiViewImageFromFiles
    to_float32: true
  -
    type: LoadPointsFromFile
    coord_type: LIDAR
    load_dim: ${load_dim}
    use_dim: ${use_dim}
    reduce_beams: ${reduce_beams}
    load_augmented: ${load_augmented}
  -
    type: LoadPointsFromMultiSweeps
    sweeps_num: ${sweeps_num}
    load_dim: ${load_dim}
    use_dim: ${use_dim}
    reduce_beams: ${reduce_beams}
    pad_empty_sweeps: true
    remove_close: true
    load_augmented: ${load_augmented}
  -
    type: LoadAnnotations3D
    with_bbox_3d: true
    with_label_3d: true
    with_attr_label: False
  -
    type: ImageAug3D
    final_dim: ${image_size}
    resize_lim: ${augment2d.resize[1]}
    bot_pct_lim: [0.0, 0.0]
    rot_lim: [0.0, 0.0]
    rand_flip: false
    is_train: false
  -
    type: GlobalRotScaleTrans
    resize_lim: [1.0, 1.0]
    rot_lim: [0.0, 0.0]
    trans_lim: 0.0
    is_train: false
  -
    type: PointsRangeFilter
    point_cloud_range: ${point_cloud_range}
  -
    type: ImageNormalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  -
    type: DefaultFormatBundle3D
    classes: ${object_classes}
  -
    type: Collect3D
    keys:
      - img
      - points
      - gt_bboxes_3d
      - gt_labels_3d
    meta_keys:
      - camera_intrinsics
      - camera2ego
      - lidar2ego
      - lidar2camera
      - camera2lidar
      - lidar2image
      - img_aug_matrix
      - lidar_aug_matrix
  -
    type: GTDepth
    keyframe_only: true

fp16:
  loss_scale: dynamic

data:
  samples_per_gpu: 4
  workers_per_gpu: 4
  train:
    type: ${dataset_type}
    dataset_root: ${dataset_root}
    ann_file: ${info_root + "navsim_infos_train.pkl"}
    pipeline: ${train_pipeline}
    object_classes: ${object_classes}
    camera_names: ${camera_names}
    modality: ${input_modality}
    eval_cfg: ${eval_cfg}
    test_mode: false
    use_valid_flag: true
    with_velocity: true
    box_type_3d: LiDAR
  val:
    type: ${dataset_type}
    dataset_root: ${dataset_root}
    ann_file: ${info_root + "navsim_infos_val.pkl"}
    pipeline: ${test_pipeline}
    object_classes: ${object_classes}
    camera_names: ${camera_names}
    modality: ${input_modality}
    eval_cfg: ${eval_cfg}
    test_mode: false
    with_velocity: true
    box_type_3d: LiDAR
  test:
    type: ${dataset_type}
    dataset_root: ${dataset_root}
    ann_file: ${info_root + "navsim_infos_val.pkl"}
    pipeline: ${test_pipeline}
    object_classes: ${object_classes}
    camera_names: ${camera_names}
    modality: ${input_modality}
    eval_cfg: ${eval_cfg}
    test_mode: true
    with_velocity: true
    box_type_3d: LiDAR

evaluation:
  interval: 1
  pipeline: ${test_pipeline}
